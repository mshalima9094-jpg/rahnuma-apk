name: Build APK
on:
  workflow_dispatch:
  push:
    branches: [main, master]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Prepare web folder
        run: |
          mkdir www
          cp index.html config.js studio.js studio-dsp.js manifest.json sw.js logo-192.png logo-512.png icon-192.png icon-512.png www/
          ls SolaimanLipi.ttf >/dev/null 2>&1 && cp SolaimanLipi.ttf www/ || true
      - name: Install Capacitor
        run: npm install
      - name: Add Android
        run: npx cap add android
      - name: Add microphone permission
        run: |
          sed -i 's#<application#<uses-permission android:name="android.permission.RECORD_AUDIO" />\n    <uses-permission android:name="android.permission.MODIFY_AUDIO_SETTINGS" />\n    <application#' android/app/src/main/AndroidManifest.xml
      - name: Sync
        run: npx cap sync android
      - name: Build APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: rahnuma-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
